<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Business Agent Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 2rem; }

    .chat-wrapper {
      display: flex; flex-direction: column;
      width: 680px; height: 600px;
      border: 1px solid #e0e0e0; border-radius: 12px;
      overflow: hidden; background: #fff;
    }

    /* ── header ── */
    .chat-header {
      padding: 12px 16px; border-bottom: 1px solid #e0e0e0;
      font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4CAF50; }

    /* ── message list ── */
    .messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      background: #fafafa;
    }

    .msg { display: flex; flex-direction: column; max-width: 72%; gap: 4px; }
    .msg.user  { align-self: flex-end;  align-items: flex-end; }
    .msg.agent { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px; border-radius: 12px;
      font-size: 14px; line-height: 1.5;
    }
    .msg.user  .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .msg.agent .bubble { background: #fff; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; color: #111; }

    .meta { font-size: 11px; color: #999; }

    /* ── loading spinner ── */
    .spinner { display: flex; gap: 4px; padding: 10px 14px;
      background: #fff; border: 1px solid #e0e0e0;
      border-radius: 12px; border-bottom-left-radius: 4px; width: fit-content; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #aaa; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* ── tool badge ── */
    .tool-badge {
      display: inline-block; font-size: 11px;
      background: #eff6ff; color: #2563eb;
      padding: 2px 6px; border-radius: 4px; margin-top: 2px;
    }

    /* ── input area ── */
    .input-area {
      padding: 12px 16px; border-top: 1px solid #e0e0e0;
      background: #fff; display: flex; gap: 8px; align-items: flex-end;
    }
    .input-area textarea {
      flex: 1; resize: none; border-radius: 8px;
      border: 1px solid #d0d0d0; padding: 8px 12px;
      font-size: 14px; font-family: inherit;
      min-height: 36px; max-height: 100px; line-height: 1.5;
    }
    .input-area textarea:focus { outline: none; border-color: #2563eb; }
    .send-btn {
      width: 36px; height: 36px; border-radius: 8px;
      background: #2563eb; border: none; cursor: pointer;
      color: #fff; font-size: 18px; display: flex;
      align-items: center; justify-content: center;
    }
    .send-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <div class="chat-header">
      <div class="status-dot"></div>
      Business Agent
      <button id="export-btn" onclick="exportChat()">⬇ Export</button>
    </div>
    

    <div class="messages" id="messages">
      <div class="msg agent">
        <div class="bubble">Hello! Ask me anything about your sales data.</div>
      </div>
    </div>

    <div class="input-area">
      <textarea id="input" placeholder="Ask about your sales data..." rows="1"></textarea>
      <button onclick="fetchResponse()" class="send-btn" id="send-btn">➤</button>
    </div>
  </div>

  <script>
    /* ── YOUR JS GOES HERE ── */
    /* Connect to: POST http://127.0.0.1:8000/query */
    /* Body: { "question": "..." } */
    /* Response: { "answer": {...}, "time_ms": 874, "tools_used": [...] } */

    // generate once per browser session
    if (!sessionStorage.getItem('session_id')) {
        sessionStorage.setItem('session_id', crypto.randomUUID())
    }
    const sessionId = sessionStorage.getItem('session_id')

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('#input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          fetchResponse()
        }
      })
    })

    async function fetchResponse() {
      const btn = document.querySelector('#send-btn')
      btn.disabled = true
      try {
          const question = document.querySelector("#input").value.trim()
          appendMsg(question, 'user')
          showSpinner()
          document.querySelector("#input").value = ''

          const response = await fetch("http://127.0.0.1:8000/query", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ question: question, session_id: sessionId }),
          });

          const data = await response.json();
          removeSpinner()

          // show tool badges before the answer
          if (data.tools_used?.length) {
              const toolsEl = document.createElement('div')
              toolsEl.className = 'msg agent'
              toolsEl.innerHTML = data.tools_used
                  .map(t => `<span class="tool-badge">🔍 ${escapeHtml(t)}</span>`)
                  .join(' ')
              document.querySelector('#messages').appendChild(toolsEl)
          }

          appendMsg(data.answer, 'agent')
          document.querySelector('#messages').scrollTop = document.querySelector('#messages').scrollHeight

      } catch(e) {
          removeSpinner()
          appendMsg('Error: could not reach the server.', 'agent')
      } finally {
          btn.disabled = false
      }
  }

    function escapeHtml(str) {  
      const div = document.createElement('div')
      div.textContent = str
      return div.innerHTML
    }

    function appendMsg(text, className) {
      const isJson = typeof text === 'object'
      const content = isJson
        ? `<pre style="font-family: monospace; font-size: 13px; white-space: pre-wrap;">${JSON.stringify(text, null, 2)}</pre>`
        : `<div>${escapeHtml(String(text))}</div>`

      document.querySelector('#messages').insertAdjacentHTML('beforeend', `
        <div class="msg ${className}">
            <div class="bubble">${content}</div>
        </div>`)
    }
    function showSpinner() {
      const spinnerEl = document.createElement('div');
      spinnerEl.className = 'msg agent';
      spinnerEl.id = 'spinnerEl'
      spinnerEl.innerHTML = `
        <div class="spinner">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      `;
      messages.appendChild(spinnerEl);
      messages.scrollTop = messages.scrollHeight;
    }
    function removeSpinner() {
      const spinnerEl = document.querySelector('#spinnerEl')
      spinnerEl.remove()
    }
    function exportChat() {
      const messages = document.querySelectorAll('.msg')
      let text = ''
      messages.forEach(msg => {
          const role = msg.classList.contains('user') ? 'You' : 'Agent'
          const content = msg.querySelector('.bubble')?.textContent || msg.textContent
          text += `${role}: ${content.trim()}\n---\n`
      })
      const blob = new Blob([text], { type: 'text/plain' })
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = 'conversation.txt'
      a.click()
    }
  </script>
</body>
</html>
